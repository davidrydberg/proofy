services:
  shop:
    image: node:24-alpine
    command: ["node", "/app/server.mjs"]
    volumes: ["./server.mjs:/app/server.mjs:ro"]
    ports: ["3000:3000"]
    environment:
      NODE_EXTRA_CA_CERTS: /proofy/ca.crt
      SMTP_HOST: mailpit
      SHOP_MODE: ${SHOP_MODE:-sandbox}
    secrets: [shop_key]
    configs:
      - source: shop_settings
        target: /app/settings.txt
secrets:
  shop_key:
    file: ./shop-key.txt
configs:
  shop_settings:
    content: currency=SEK
